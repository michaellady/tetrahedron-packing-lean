name = "tetrahedron_packing"
defaultTargets = ["TetrahedronPacking", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "9d581dfff2e41de989072ea63abf3daf69311520"

[[input_file]]
name = "publishedCell"
path = "benchmarks/ceg.json"

[[input_file]]
name = "duplicateCell"
path = "benchmarks/ceg-remote-duplicate.json"

[[lean_lib]]
name = "TetrahedronPacking"
globs = ["TetrahedronPacking", "TetrahedronPacking.+"]
needs = ["@/publishedCell", "@/duplicateCell"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "ClearanceChallenge"

[[lean_lib]]
name = "ClearanceSolution"
