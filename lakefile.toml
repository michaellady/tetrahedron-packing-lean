name = "tetrahedron_packing"
defaultTargets = ["TetrahedronPacking"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c44e0c8ee63ca166450922a373c7409c5d26b00b"

[[input_file]]
name = "publishedCell"
path = "benchmarks/ceg.json"

[[input_file]]
name = "duplicateCell"
path = "benchmarks/ceg-remote-duplicate.json"

[[lean_lib]]
name = "TetrahedronPacking"
globs = ["TetrahedronPacking", "TetrahedronPacking.+"]
needs = ["@/publishedCell", "@/duplicateCell"]
